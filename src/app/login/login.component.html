<div class="fullscreen-container">
  <!-- Fullscreen image that shows when the login form is hidden -->
  <div *ngIf="!showLoginForm" class="fullscreen-image" (click)="toggleLoginForm()">
    <div class="image-overlay">
      <!-- Instruction text removed -->
    </div>
  </div>

  <!-- Login form that shows after clicking the image -->
  <div *ngIf="showLoginForm" class="login-container">
    <div class="login-card">
      <h2 class="login-title">Login</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email"
            class="form-control"
          >
          <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="password" 
            formControlName="password"
            placeholder="Enter your password"
            class="form-control"
          >
          <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>
        
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        
        <div class="form-actions">
          <button 
            type="submit" 
            class="login-button" 
            [disabled]="loginForm.invalid || isSubmitting"
          >
            {{ isSubmitting ? 'Logging in...' : 'Login' }}
          </button>
        </div>
        
        <div class="additional-links">
          <a href="#">Forgot Password?</a>
          <a href="#" routerLink="/register">Create an Account</a>
        </div>
      </form>
    </div>
  </div>
</div>
